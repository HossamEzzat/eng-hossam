name: lumina
description: جلسات البرمجة — أ. حسام عزت · Flutter Web (عربي RTL).
publish_to: 'none'
version: 1.0.14+15

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_analytics: ^11.4.5

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  responsive_framework: ^1.5.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  visibility_detector: ^0.4.0+2
  smooth_page_indicator: ^1.2.1

  # Features
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.1
  file_picker: ^10.1.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  collection: ^1.19.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  lottie: ^3.3.0
  fl_chart: ^0.71.0
  csv: ^6.0.0
  path_provider: ^2.1.5
  http: ^1.3.0
  animated_text_kit: ^4.2.3
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
    - assets/branding/
