  <script>
    // Safari can hang forever on serviceWorker.getRegistrations() / caches.keys().
    // Never block Flutter boot on cache wipe. Build stamp: 1.0.14+15
    (function () {
      var BUILD = '1.0.14+15';
      var KEY = 'eng_hossam_build';
      var booted = false;

      function bootFlutter() {
        if (booted) return;
        booted = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(BUILD);
        s.async = true;
        document.body.appendChild(s);
      }

      function wipeCaches() {
        var tasks = [];
        try {
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
            );
          }
        } catch (e) {}
        try {
          if (window.caches && caches.keys) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              })
            );
          }
        } catch (e) {}
        return Promise.all(tasks);
      }

      var previous = null;
      try { previous = localStorage.getItem(KEY); } catch (e) {}

      // Hard timeout so Safari never leaves a blank page.
      setTimeout(bootFlutter, 1200);

      wipeCaches().then(function () {
        try { localStorage.setItem(KEY, BUILD); } catch (e) {}
        if (previous && previous !== BUILD) {
          var url = new URL(window.location.href);
          if (url.searchParams.get('_v') !== BUILD) {
            url.searchParams.set('_v', BUILD);
            window.location.replace(url.toString());
            return;
          }
        }
        bootFlutter();
      }).catch(function () {
        bootFlutter();
      });
    })();
  </script>
